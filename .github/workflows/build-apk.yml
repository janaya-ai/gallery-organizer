name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure offline bundle and Kotlin 1.9.25
        run: |
          echo "android.kotlinVersion=1.9.25" >> android/gradle.properties
          echo "kotlinVersion=1.9.25" >> android/gradle.properties
          # Force bundling offline JS bundle into the APK
          sed -i 's/\/\/ debuggableVariants = .*/debuggableVariants = []/' android/app/build.gradle

      - name: Build Standalone Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.kotlinVersion=1.9.25 -PkotlinVersion=1.9.25 --no-daemon
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/GalleryOrganizer.apk
          ls -lh dist/GalleryOrganizer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalleryOrganizer-APK
          path: dist/GalleryOrganizer.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gallery Organizer v1.0.${{ github.run_number }}
          body: |
            ### Standalone Android APK for Gallery Organizer
            - Contains full offline JavaScript bundle.
            - Download `GalleryOrganizer.apk` directly onto your Android device.
            - Tap to install (enable "Install unknown apps" for your browser if prompted).
          files: dist/GalleryOrganizer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
